<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<title>Amit’s Recipes</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fffdf9;--ink:#3a2b21;--mute:#8c7868;--line:#e8dccb;--accent:#c4573f;--ai:#fff;--sel:#fbe9e2;--beige:#f1e6d6;--gold:#c9953c;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1e1713;--card:#2a211b;--ink:#f4eadd;--mute:#b3a08e;--line:#40342b;--accent:#e0866f;--ai:#1e1713;--sel:#3b2a24;--beige:#33291f;--gold:#d9a95a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
h1{font:700 1.5rem/1.2 Fraunces,"DM Sans",Georgia,serif;margin:0}
h2{font:600 1.1rem/1.3 Fraunces,"DM Sans",Georgia,serif;margin:0 0 10px}
h3{font:600 1rem/1.3 Fraunces,"DM Sans",Georgia,serif;margin:16px 0 8px;display:flex;align-items:center;gap:8px;color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;color:inherit;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:var(--ai);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.nav a,.nav span{background:none;border:0;border-radius:8px;padding:7px 16px;cursor:pointer;font-weight:600;color:var(--mute);text-decoration:none}
.nav span{background:var(--accent);color:var(--ai)}
.hero{background:linear-gradient(135deg,var(--sel),var(--beige));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.hero .big{font-size:2rem;letter-spacing:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:110px;resize:vertical}
.fr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.85rem}
.chip.on{background:var(--sel);border-color:var(--accent)}
.rc{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.rc:hover{border-color:var(--accent)}
.rc .em{width:46px;height:46px;border-radius:12px;background:var(--sel);display:grid;place-items:center;font-size:1.5rem;flex:none}
.rc .tx{min-width:0;flex:1}
.rc b{display:block}
.rc small,.sub,.st{color:var(--mute);font-size:.88rem}
.rc .go{color:var(--mute);font-size:1.3rem}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.t{flex:1;min-width:0;overflow-wrap:anywhere}
.t small{display:block;color:var(--mute)}
.row.done .t span{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:1.15rem;cursor:pointer;padding:2px 8px}
ol{margin:6px 0;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;margin-bottom:11px;padding-inline-start:38px;position:relative}
ol li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ai);font:700 .85rem/26px "DM Sans",sans-serif;text-align:center}
.err{color:#c0392b}
.empty{color:var(--mute);text-align:center;padding:26px 8px}
a{color:var(--accent)}
.badge{background:var(--accent);color:var(--ai);border-radius:999px;font-size:.75rem;padding:1px 7px;margin-inline-start:4px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px;width:min(460px,94vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="wrap">
<header><a class="btn" href="/" id="back">← Back to Amiti’s</a><h1>🍳 Amit’s Recipes</h1></header>
<div id="v"></div>
</div>
<dialog id="dlgS"><div id="dS"></div></dialog>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var CATS=[['Baking & dough','🥖'],['Cakes & desserts','🍰'],['Meat','🥩'],['Chicken','🍗'],['Fish','🐟'],['Vegetarian & vegan','🥬'],['Pasta & rice','🍝'],['Soups','🍲'],['Salads & sides','🥗'],['Breakfast','🍳'],['Snacks & drinks','🥤'],['Healthy & light','🥑'],['Other','🍽️']];
var LEG={'אפייה ובצקים':'Baking & dough','עוגות וקינוחים':'Cakes & desserts','בשרי':'Meat','עוף':'Chicken','דגים':'Fish','צמחוני וטבעוני':'Vegetarian & vegan','פסטה ואורז':'Pasta & rice','מרקים':'Soups','סלטים ותוספות':'Salads & sides','ארוחות בוקר':'Breakfast','חטיפים ומשקאות':'Snacks & drinks','בריא וקל':'Healthy & light','אחר':'Other'};
var EM={};CATS.forEach(function(c){EM[c[0]]=c[1]});
var S={recipes:[],shop:[],view:'list',cur:null,add:false,busy:false,msg:'',err:false,sel:{},cd:false,cat:'',prefill:''};
var NOTION=false,GEM=false,nMsg='',nT=null,CFGOK=false;
var snap={recipes:{},shop:{}},syncBusy=false,syncDirty=false,syncT=null,failN=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function api(path,body){return fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw{code:j.code||(r.status===429?'rate_limited':r.status===401?'auth':'upstream_error'),message:j.error||'',detail:j.detail||''};return j})})}
/* sync: same /api/sync as Amiti's (recipes + shopping list) */
function save(){clearTimeout(syncT);syncT=setTimeout(doSync,300)}
function doSync(){syncT=null;if(syncBusy){syncDirty=true;return}
  var body={recipes:{upsert:[],del:[]},shop:{upsert:[],del:[]}},next={recipes:{},shop:{}},n=0;
  function diff(k,list){var cur={};list.forEach(function(e){cur[e.id]=e});var old=snap[k];
    Object.keys(cur).forEach(function(id){var j=JSON.stringify(cur[id]);next[k][id]=j;if(old[id]!==j){body[k].upsert.push(cur[id]);n++}});
    Object.keys(old).forEach(function(id){if(!(id in cur)){body[k].del.push(id);n++}})}
  diff('recipes',S.recipes);diff('shop',S.shop);if(!n)return;syncBusy=true;
  api('/api/sync',body).then(function(){snap=next;failN=0;nTick(4000)}).catch(function(){failN++;syncDirty=true;S.msg='Could not save, retrying…';S.err=true})
   .then(function(){syncBusy=false;if(syncDirty){syncDirty=false;clearTimeout(syncT);syncT=setTimeout(doSync,Math.min(30000,2000*(failN||1)))}})}
function load(){return fetch('/api/state').then(function(r){if(r.status===401){location.href='/login';throw 0}if(!r.ok)throw 0;return r.json()}).then(function(st){
  S.recipes=st.recipes||[];S.shop=st.shop||[];snap={recipes:{},shop:{}};S.recipes.forEach(function(e){snap.recipes[e.id]=JSON.stringify(e)});S.shop.forEach(function(e){snap.shop[e.id]=JSON.stringify(e)});render();autoSort()})}
/* Notion (two-way, runs on the server) */
function nTick(ms){if(!NOTION)return;clearTimeout(nT);nT=setTimeout(nRun,ms)}
function nRun(manual){if(!NOTION)return;if(syncBusy||syncT){nTick(3000);return}
  if(manual){nMsg='Syncing with Notion…';draw()}
  fetch('/api/notion/sync',{method:'POST'}).then(function(r){return r.json()}).then(function(j){
    if(j.busy){if(manual)nMsg='Notion sync is already running…';draw();return}
    if(!j.ok){nMsg=j.error==='notion_no_page'?'Notion: share a page with the integration first (see below)':j.error==='notion_auth'?'Notion rejected the token':'Notion sync failed ['+(j.error||'?')+']';draw();return}
    nMsg='Notion: synced ✓';if(j.changed){load()}else draw();if(j.more)nTick(3000)}).catch(function(){nMsg='Notion sync failed';draw()})}
function draw(){var e=$('nst');if(e)e.textContent=nMsg}
/* AI (same /api/ai as Amiti's) */
var CATLIST=CATS.map(function(c){return c[0]}).join(' | ');
var PROMPT='You turn a recipe (a web page, a social-media caption or a photo) into structured data. Keep the language of the source (Hebrew stays Hebrew). Reply with ONLY a JSON object: {"title": short recipe name, "category": exactly one of ['+CATLIST+'], "servings": text like "4" or "", "ingredients": [each ingredient as one string with its amount, e.g. "2 ביצים"], "steps": [short instruction strings in order], "notes": ""}. Use only what is in the source; do not invent ingredients. If there is no recipe at all, reply {"title":"","ingredients":[],"steps":[]}.';
function parseJ(t){t=String(t||'');var a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)return;try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){res(String(r.result).split(',')[1])};r.readAsDataURL(blob)})}
function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var m=1600,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},'image/jpeg',.8)};im.src=fr.result};fr.readAsDataURL(file)})}
function ask(text,photo){
  var p=photo?shrink(photo).then(b64).then(function(d){return[{media_type:'image/jpeg',data:d}]}):Promise.resolve([]);
  return p.then(function(imgs){return api('/api/ai',{messages:[{role:'user',content:PROMPT+(text?'\n\nSource:\n'+text.slice(0,7000):'\n\nThe attached photo shows the recipe.')}],images:imgs})}).then(function(j){var o=parseJ(j.text);if(!o)throw{code:'no_recipe'};return o})}
function normCat(c){c=String(c||'').trim();if(LEG[c])return LEG[c];for(var i=0;i<CATS.length;i++)if(c===CATS[i][0]||c.indexOf(CATS[i][0])>=0)return CATS[i][0];return 'Other'}
function firstUrl(t){var m=/https?:\/\/[^\s<>"']+/i.exec(t||'');return m?m[0].replace(/[).,;]+$/,''):''}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}}
function mk(r,src,img){var ing=(r.ingredients||r.ing||[]).map(function(x){return String(x).trim()}).filter(Boolean).slice(0,100),steps=(r.steps||[]).map(function(x){return String(x).trim()}).filter(Boolean).slice(0,80),title=String(r.title||'').trim();
  if(!title||(!ing.length&&!steps.length))return null;
  return{id:uid(),title:title.slice(0,160),source:src||'',servings:String(r.servings||'').slice(0,40),ing:ing,steps:steps,notes:String(r.notes||'').slice(0,1500),img:/^https:\/\//.test(img||'')?img:'',cat:normCat(r.category||r.cat)}}
function imp(input,photo){
  var url=photo?'':firstUrl(input),rest=input.replace(url,'').trim(),p;S.why='';
  if(photo)p=ask('',photo).then(function(o){return mk(o,'','')});
  else if(url&&rest.length<300)p=api('/api/recipes/fetch',{url:url}).catch(function(){return{error:'unreadable',why:'server'}}).then(function(j){
    if(j.recipe){var r0=mk(j.recipe,j.source||url,j.recipe.img);if(r0)return ask('Title: '+j.recipe.title+'\nIngredients: '+(j.recipe.ingredients||[]).join('; ')).then(function(o){r0.cat=normCat(o.category);return r0}).catch(function(){r0.cat='Other';return r0})}
    if(j.text)return ask((rest?rest+'\n':'')+j.text).then(function(o){return mk(o,j.source||url,j.img)});
    S.why=j.why||'';
    // the link could not be read, but the share text next to it may hold the recipe
    if(rest.length>=25)return ask(rest).then(function(o){return mk(o,url,'')}).catch(function(){throw{code:'unreadable'}});
    throw{code:'unreadable'}});
  else p=ask(input).then(function(o){return mk(o,url,'')});
  return p.then(function(r){if(!r)throw{code:'no_recipe'};return r})}
/* put old recipes without a category into the right style, quietly */
var sorting=false;
function autoSort(){var ch=false;S.recipes.forEach(function(r){if(LEG[r.cat]){r.cat=LEG[r.cat];ch=true}});if(ch){save();render()}
  var todo=S.recipes.filter(function(r){return !r.cat}).slice(0,25);if(!todo.length||sorting)return;sorting=true;
  api('/api/ai',{messages:[{role:'user',content:'Classify each recipe into exactly one category from ['+CATLIST+']. Reply with ONLY a JSON object mapping the id to the category. Recipes:\n'+todo.map(function(r){return r.id+': '+r.title+' — '+r.ing.slice(0,6).join(', ')}).join('\n')}],images:[]})
  .then(function(j){var m=parseJ(j.text)||{};todo.forEach(function(r){if(m[r.id])r.cat=normCat(m[r.id])});save();render()}).catch(function(){}).then(function(){sorting=false})}
/* views */
function render(){if(S.view==='one')oneView();else listView()}
function listView(){var h='<div class="hero"><div class="big">🍳🥘🍰</div><div><b>My recipes</b><div class="sub">'+S.recipes.length+' recipes, grouped by style</div></div></div>';
  if(S.add){h+='<div class="card"><h2>New recipe</h2><p class="sub">Paste a link (TikTok, Instagram, any site), a caption or the recipe text, or add a screenshot.</p><textarea id="in" dir="auto" placeholder="Paste here…">'+esc(S.prefill)+'</textarea><div class="fr" style="margin-top:8px"><button class="btn p" id="go"'+(S.busy?' disabled':'')+'>'+(S.busy?'Writing…':'Write the recipe')+'</button><label class="btn" for="ph">📷 Screenshot</label><input id="ph" type="file" accept="image/*" hidden><button class="btn" id="cx">Cancel</button></div><div class="st'+(S.err?' err':'')+'" style="margin-top:8px">'+esc(S.msg)+'</div></div>'}
  else{h+='<div class="top"><button class="btn p" id="new">＋ New recipe</button></div>';if(S.msg)h+='<div class="st'+(S.err?' err':'')+'" style="margin-bottom:8px">'+esc(S.msg)+'</div>'}
  var used={};S.recipes.forEach(function(r){var k=normCat(r.cat||'Other');used[k]=(used[k]||0)+1});
  if(S.recipes.length>1){h+='<div class="chips"><button class="chip'+(S.cat?'':' on')+'" data-c="">All</button>';CATS.forEach(function(c){if(used[c[0]])h+='<button class="chip'+(S.cat===c[0]?' on':'')+'" data-c="'+esc(c[0])+'">'+c[1]+' '+esc(c[0])+' ('+used[c[0]]+')</button>'});h+='</div>'}
  if(!S.recipes.length&&!S.add)h+='<div class="empty">🥐 🧁 🍪<br>No recipes yet. Tap “New recipe” and paste your first one.</div>';
  CATS.forEach(function(c){if(S.cat&&S.cat!==c[0])return;var L=S.recipes.filter(function(r){return(r.cat||'Other')===c[0]}).reverse();if(!L.length)return;
    h+='<h3>'+c[1]+' '+esc(c[0])+'</h3>';
    L.forEach(function(r){var n=S.shop.filter(function(x){return x.rid===r.id&&!x.done}).length;
      h+='<div class="rc" data-id="'+esc(r.id)+'"><span class="em">'+c[1]+'</span><div class="tx"><b dir="auto">'+esc(r.title)+'</b><small>'+r.ing.length+(r.ing.length===1?' ingredient':' ingredients')+(r.source?' · '+esc(hostOf(r.source)):'')+(n?' · 🛒 '+n+' to buy':'')+'</small></div><span class="go">›</span></div>'})});
  if(CFGOK)h+='<div class="st" style="margin-top:14px">AI: '+(GEM?'Gemini ✓':'Cloudflare AI (GEMINI_API_KEY not found)')+'<br><span id="nst">'+esc(nMsg)+'</span>'+(NOTION?' <button class="btn" id="nsync" style="padding:2px 10px;font-size:.85rem">Sync with Notion</button>':'')+'</div>';
  $('v').innerHTML=h;
  var b=$('new');if($('nsync'))$('nsync').onclick=function(){nRun(true)};if(b)b.onclick=function(){S.add=true;S.msg='';S.prefill='';render()};
  b=$('cx');if(b)b.onclick=function(){S.add=false;S.msg='';render()};
  function run(photo){var v=$('in').value.trim();if(!photo&&!v){S.msg='Paste something first';S.err=true;render();return}
    S.busy=true;S.msg=photo?'Reading the screenshot…':'Reading the recipe…';S.err=false;S.prefill=v;render();
    imp(v,photo).then(function(r){S.recipes.push(r);save();S.add=false;S.busy=false;S.prefill='';S.cur=r.id;S.view='one';S.msg='';render()}).catch(function(e){
      var c=e&&e.code;S.busy=false;S.err=true;S.msg=c==='no_recipe'?'I could not find a recipe there. In videos the recipe is often not in the caption – paste the text or add a screenshot.':c==='unreadable'?'I could not read this link (TikTok and Instagram sometimes block it)'+(S.why?' ['+S.why+']':'')+'. Paste the caption or add a screenshot of the recipe.':c==='rate_limited'?'The free AI hit today’s limit, try later.':'Something went wrong, try again.'+(e&&e.detail?' ['+String(e.detail).slice(0,160)+']':'');render()})}
  b=$('go');if(b)b.onclick=function(){run(null)};
  b=$('ph');if(b)b.onchange=function(){var f=this.files&&this.files[0];this.value='';if(f)run(f)};
  Array.prototype.forEach.call($('v').querySelectorAll('.chip'),function(el){el.onclick=function(){S.cat=el.getAttribute('data-c');render()}});
  Array.prototype.forEach.call($('v').querySelectorAll('.rc'),function(el){el.onclick=function(){S.cur=el.getAttribute('data-id');S.view='one';S.msg='';window.scrollTo(0,0);render()}})}
function mine(r){return S.shop.filter(function(x){return x.rid===r.id})}
function oneView(){var r=S.recipes.filter(function(x){return x.id===S.cur})[0];if(!r){S.view='list';return render()}
  var open=mine(r).filter(function(x){return !x.done}).length,cat=r.cat||'Other';
  var h='<div class="top"><button class="btn" id="bk">← Back</button><div class="fr"><button class="btn p" id="shopb">🛒 Shopping list'+(open?'<span class="badge">'+open+'</span>':'')+'</button><button class="btn" id="del">Delete</button></div></div>'+
  '<div class="card"><div class="sub">'+EM[cat]+' '+esc(cat)+'</div><h2 dir="auto" style="font-size:1.4rem">'+esc(r.title)+'</h2><div class="sub">'+(r.servings?'Serves '+esc(r.servings):'')+(r.source?(r.servings?' · ':'')+'<a href="'+esc(r.source)+'" target="_blank" rel="noopener">Source: '+esc(hostOf(r.source))+'</a>':'')+'</div>'+
  '<div class="fr" style="margin-top:8px"><span class="sub">Style:</span><select id="cs" style="width:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px">'+CATS.map(function(c){return '<option'+(c[0]===cat?' selected':'')+'>'+esc(c[0])+'</option>'}).join('')+'</select></div></div>'+
  '<div class="card"><h2>Ingredients</h2>'+r.ing.map(function(t){return '<div class="row"><span class="t" dir="auto">'+esc(t)+'</span></div>'}).join('')+'</div>';
  if(r.steps.length){h+='<div class="card"><h2>Method</h2><ol>'+r.steps.map(function(s){return '<li dir="auto">'+esc(s)+'</li>'}).join('')+'</ol></div>'}
  if(r.notes)h+='<div class="card"><b>Tip:</b> <span dir="auto">'+esc(r.notes)+'</span></div>';
  $('v').innerHTML=h;
  $('bk').onclick=function(){S.view='list';S.msg='';render()};
  $('shopb').onclick=function(){openShop(r)};
  $('cs').onchange=function(){r.cat=this.value;save();render()};
  $('del').onclick=function(){if(!S.cd){S.cd=true;$('del').textContent='Sure? Tap again';return}S.cd=false;S.recipes=S.recipes.filter(function(x){return x.id!==r.id});save();S.view='list';render()}}
/* the recipe's shopping list lives in a pop-up on the recipe, and is the same list as in Amiti's Shopping tab */
function openShop(r){S.sel={};drawShop(r);try{$('dlgS').showModal()}catch(e){$('dlgS').setAttribute('open','')}}
function drawShop(r){var list=mine(r),have={};list.forEach(function(x){have[x.name]=1});var miss=r.ing.filter(function(t){return !have[t]});
  var h='<div class="top"><h2 style="margin:0">🛒 '+esc(r.title)+'</h2><button class="btn" id="sx">Close</button></div>';
  if(list.length){h+='<div>';list.forEach(function(s){h+='<div class="row'+(s.done?' done':'')+'"><input type="checkbox" data-id="'+esc(s.id)+'"'+(s.done?' checked':'')+'><span class="t" dir="auto"><span>'+esc(s.name)+'</span></span><a href="https://www.google.com/search?q='+encodeURIComponent('חצי חינם '+s.name)+'" target="_blank" rel="noopener" title="Search at Hatzi Hinam" style="text-decoration:none">🔍</a><button class="x" data-x="'+esc(s.id)+'" aria-label="מחיקה">×</button></div>'});h+='</div>';
    if(list.some(function(x){return x.done}))h+='<div style="margin-top:8px"><button class="btn" id="sc">Clear bought items</button></div>'}
  else h+='<div class="sub">Nothing on the list for this recipe yet.</div>';
  if(miss.length){h+='<h3 style="color:var(--ink)">Add to the list</h3>';miss.forEach(function(t,i){h+='<label class="row"><input type="checkbox" data-i="'+i+'"'+(S.sel[i]===false?'':' checked')+'><span class="t" dir="auto">'+esc(t)+'</span></label>'});h+='<div style="margin-top:10px"><button class="btn p" id="sa">Add to list</button></div>'}
  h+='<p class="sub" style="margin-bottom:0">This list also appears in Shopping in Amiti\'s.</p>';
  $('dS').innerHTML=h;
  $('sx').onclick=function(){$('dlgS').close();render()};
  Array.prototype.forEach.call($('dS').querySelectorAll('input[data-id]'),function(c){c.onchange=function(){var s=S.shop.filter(function(x){return x.id===c.getAttribute('data-id')})[0];if(s){s.done=c.checked;save();drawShop(r)}}});
  Array.prototype.forEach.call($('dS').querySelectorAll('[data-x]'),function(b){b.onclick=function(){S.shop=S.shop.filter(function(x){return x.id!==b.getAttribute('data-x')});save();drawShop(r)}});
  Array.prototype.forEach.call($('dS').querySelectorAll('input[data-i]'),function(c){c.onchange=function(){S.sel[c.getAttribute('data-i')]=c.checked}});
  var b=$('sc');if(b)b.onclick=function(){S.shop=S.shop.filter(function(x){return !(x.rid===r.id&&x.done)});save();drawShop(r)};
  b=$('sa');if(b)b.onclick=function(){miss.forEach(function(t,i){if(S.sel[i]===false)return;S.shop.push({id:uid(),name:t.slice(0,120),done:false,rid:r.id,rname:r.title.slice(0,160)})});S.sel={};save();drawShop(r)}}
$('dlgS').addEventListener('close',function(){render()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!syncBusy&&!syncT&&!$('dlgS').open)load().catch(function(){})});
fetch('/api/config').then(function(r){return r.json()}).then(function(c){CFGOK=true;GEM=!!c.gemini;NOTION=!!c.notion;if(!NOTION)nMsg='Notion: token not found (NOTION_TOKEN secret missing)';if(NOTION){nMsg='Notion connected';render();nTick(1500)}}).catch(function(){});
load().then(function(){try{var q=new URLSearchParams(location.search).get('add');if(q){history.replaceState(null,'',location.pathname);S.add=true;S.view='list';S.prefill=q;render()}}catch(e){}}).catch(function(){$('v').innerHTML='<div class="empty">Could not load. Check your connection and reload.</div>'});
})();
</script>
</body>
</html>
