name = "amitis"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# Static frontend. The Worker runs first for every request so it can check
# the Cloudflare Access login before anything is served.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "amitis"
database_id = "c8dcd800-50ee-475b-ba1f-223c8229adc4"

# Free AI (Cloudflare Workers AI, daily free allowance). Used when no ANTHROPIC_API_KEY is set.
[ai]
binding = "AI"

[vars]
TIMEZONE = "Asia/Jerusalem"
# Optional: only if you protect the app with Cloudflare Access instead of a password (see README).
TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Optional model overrides (check the Workers AI model list in the Cloudflare dashboard if one is retired).
AI_TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct"
AI_VISION_MODEL = "@cf/llava-hf/llava-1.5-7b-hf"
# Only used if you add a paid ANTHROPIC_API_KEY:
AI_MODEL = "claude-sonnet-5-5"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   APP_PASSWORD (10+ characters), GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   ANTHROPIC_API_KEY is optional and costs money. Leave it unset to stay free.
